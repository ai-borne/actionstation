name: PR Preview

on:
  pull_request:
    branches: [main]
    # closed → delete the PR's channel (Hosting caps a site at 50 preview channels)
    types: [opened, synchronize, reopened, closed]

env:
  # Keep in sync with ci.yml/deploy.yml (enforced by ciWorkflows.structural.test.ts).
  FIREBASE_TOOLS_VERSION: '15.30.2'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # needed to post preview URL comment
      checks: write        # needed for Firebase deploy check run

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build:quick
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_CLOUD_FUNCTIONS_URL: ${{ secrets.VITE_CLOUD_FUNCTIONS_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_APP_ENV: preview

      - name: Deploy Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 3d  # fallback only; cleanup below deletes the channel on close

  cleanup:
    name: Delete Preview Channel
    # Fork PRs get no secrets and never get a channel, so there is nothing to delete.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # firebase hosting commands exit 1 without firebase.json ("Not in a Firebase app directory").
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Delete pr-N channel if it exists
        env:
          PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          # List first (fails the step on auth/API errors) so a missing channel is the only no-op.
          channels=$(npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} hosting:channel:list --project "$PROJECT" --json) || { echo "$channels"; exit 1; }
          if echo "$channels" | jq -e --arg c "$CHANNEL" '.result.channels[] | select(.name | endswith("/channels/" + $c))' > /dev/null; then
            npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} hosting:channel:delete "$CHANNEL" --project "$PROJECT" --force
          else
            echo "No channel $CHANNEL (deploy never ran or already expired); nothing to delete."
          fi
